<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Strategic DevOps & Engineering Master Plan - Dhaka → Global → Tokyo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
            background: #0a0a0f;
            color: #e8e8f0;
            min-height: 100vh;
        }

        .header {
            background: #0a0a0f;
            border-bottom: 1px solid #1e1e2e;
            padding: 24px 20px 0;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.7);
        }

        .header-content {
            max-width: 1100px;
            margin: 0 auto;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .header-title-section h1 {
            margin: 0;
            font-size: clamp(18px, 3vw, 26px);
            font-weight: 800;
            background: linear-gradient(135deg, #fff 0%, #a0a0c0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-title-section .label {
            font-size: 11px;
            letter-spacing: 3px;
            color: #6C63FF;
            text-transform: uppercase;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .header-badges {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .badge {
            background: #1e1e2e;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
        }

        .badge span:first-child {
            color: #6C63FF;
            font-weight: 700;
            margin-right: 6px;
        }

        .badge span:last-child {
            color: #a0a0c0;
        }

        .phase-selector {
            display: flex;
            gap: 4px;
            overflow-x: auto;
            padding: 8px 0 0;
            margin-top: 8px;
            background: #0a0a0f;
        }

        .phase-btn {
            padding: 8px 14px;
            background: transparent;
            color: #666;
            border: none;
            border-radius: 6px 6px 0 0;
            cursor: pointer;
            font-size: 11px;
            font-weight: 500;
            white-space: nowrap;
            transition: all 0.2s;
            border-bottom: 2px solid transparent;
            flex-shrink: 0;
        }

        .phase-btn.active {
            font-weight: 700;
            color: #fff;
            border-bottom-color: currentColor;
        }

        .main-content {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px 40px;
        }

        .phase-hero {
            background: linear-gradient(135deg, rgba(108, 99, 255, 0.13) 0%, #12121e 100%);
            border: 1px solid rgba(108, 99, 255, 0.27);
            border-top: none;
            border-radius: 0 0 12px 12px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .hero-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 12px;
        }

        .hero-title-section {
            flex: 1;
            min-width: 200px;
        }

        .hero-icon {
            font-size: clamp(20px, 4vw, 32px);
            margin-bottom: 4px;
        }

        .hero-title {
            margin: 0 0 4px;
            font-size: clamp(16px, 2.5vw, 22px);
            font-weight: 800;
            color: #fff;
        }

        .hero-subtitle {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .hero-period {
            color: #666;
            font-size: 12px;
        }

        .hero-mission {
            background: rgba(10, 10, 15, 0.53);
            border-radius: 8px;
            padding: 12px 16px;
            max-width: 340px;
        }

        .mission-label {
            font-size: 11px;
            color: #666;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .mission-text {
            font-size: 12px;
            color: #c0c0d8;
            line-height: 1.6;
        }

        .systems-status {
            display: flex;
            gap: 8px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .system-chip {
            background: #0a0a0f;
            border: 1px solid rgba(108, 99, 255, 0.2);
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 10px;
        }

        .system-chip-label {
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: block;
            margin-bottom: 2px;
        }

        .system-chip-value {
            color: #a0a0c0;
        }

        .tab-navigation {
            display: flex;
            gap: 4px;
            margin-bottom: 20px;
            border-bottom: 1px solid #1e1e2e;
            padding-bottom: 0;
            overflow-x: auto;
        }

        .tab-btn {
            padding: 8px 14px;
            background: transparent;
            color: #555;
            border: none;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .tab-btn.active {
            font-weight: 700;
            border-bottom-color: currentColor;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .overview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
        }

        .do-list, .dont-list {
            background: #12121e;
            border-radius: 12px;
            padding: 20px;
        }

        .do-list {
            border: 1px solid rgba(0, 200, 150, 0.2);
        }

        .dont-list {
            border: 1px solid rgba(255, 107, 107, 0.2);
        }

        .list-header {
            font-weight: 800;
            font-size: 13px;
            margin-bottom: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .do-list .list-header {
            color: #00C896;
        }

        .dont-list .list-header {
            color: #FF6B6B;
        }

        .list-item {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: flex-start;
        }

        .list-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            margin-top: 5px;
            flex-shrink: 0;
        }

        .do-list .list-dot {
            background: #00C896;
        }

        .dont-list .list-dot {
            background: #FF6B6B;
        }

        .list-text {
            font-size: 12px;
            color: #c0c0d8;
            line-height: 1.6;
        }

        .tracker-container {
            background: #12121e;
            border-radius: 12px;
            padding: 20px;
        }

        .tracker-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .tracker-title {
            font-weight: 800;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .tracker-count {
            font-size: 12px;
            color: #666;
        }

        .progress-bar {
            background: #0a0a0f;
            border-radius: 6px;
            height: 4px;
            margin-bottom: 16px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            border-radius: 6px;
            transition: width 0.3s;
        }

        .tracker-item {
            display: flex;
            gap: 12px;
            margin-bottom: 10px;
            align-items: center;
            cursor: pointer;
            padding: 10px 12px;
            border-radius: 8px;
            background: #0a0a0f;
            border: 1px solid #1e1e2e;
            transition: all 0.2s;
        }

        .tracker-item.checked {
            border-color: currentColor;
            background: rgba(108, 99, 255, 0.07);
        }

        .checkbox {
            width: 20px;
            height: 20px;
            border-radius: 5px;
            border: 2px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .tracker-item.checked .checkbox {
            border-color: currentColor;
            background: currentColor;
            color: #fff;
            font-size: 11px;
            font-weight: 800;
        }

        .tracker-task {
            flex: 1;
            font-size: 12px;
            color: #c0c0d8;
        }

        .tracker-item.checked .tracker-task {
            color: #888;
            text-decoration: line-through;
        }

        .tracker-tag {
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 700;
            text-transform: uppercase;
            flex-shrink: 0;
        }

        .tips-container, .resources-container, .scenarios-container {
            background: #12121e;
            border-radius: 12px;
            padding: 20px;
        }

        .section-title {
            font-weight: 800;
            font-size: 13px;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .tip-item {
            display: flex;
            gap: 12px;
            margin-bottom: 14px;
            padding: 12px 14px;
            background: #0a0a0f;
            border-radius: 8px;
            border: 1px solid rgba(108, 99, 255, 0.13);
        }

        .tip-icon {
            font-size: 16px;
            flex-shrink: 0;
        }

        .tip-text {
            font-size: 12px;
            color: #c8c8e0;
            line-height: 1.7;
        }

        .resource-item {
            display: flex;
            gap: 12px;
            margin-bottom: 10px;
            padding: 12px 14px;
            background: #0a0a0f;
            border-radius: 8px;
            border: 1px solid #1e1e2e;
            align-items: center;
        }

        .resource-number {
            background: currentColor;
            color: #fff;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 800;
            flex-shrink: 0;
        }

        .resource-info {
            flex: 1;
        }

        .resource-name {
            font-size: 13px;
            font-weight: 600;
            color: #e0e0f0;
        }

        .resource-note {
            font-size: 11px;
            color: #666;
            margin-top: 2px;
        }

        .resource-url {
            font-size: 11px;
            font-family: monospace;
        }

        .scenarios-grid {
            display: grid;
            gap: 12px;
        }

        .scenario-card {
            background: #12121e;
            border-radius: 12px;
            padding: 20px;
        }

        .scenario-card.best {
            border: 1px solid rgba(0, 200, 150, 0.2);
        }

        .scenario-card.worst {
            border: 1px solid rgba(255, 159, 67, 0.2);
        }

        .scenario-card.key {
            border: 1px solid rgba(108, 99, 255, 0.27);
        }

        .scenario-header {
            font-weight: 800;
            font-size: 12px;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .scenario-text {
            font-size: 13px;
            color: #c0c0d8;
            line-height: 1.7;
        }

        .income-chart {
            background: #12121e;
            border: 1px solid #1e1e2e;
            border-radius: 12px;
            padding: 20px;
            margin-top: 24px;
        }

        .chart-title {
            color: #fff;
            font-weight: 800;
            font-size: 13px;
            margin-bottom: 4px;
        }

        .chart-description {
            color: #FF9F43;
            font-size: 11px;
            margin-bottom: 16px;
            line-height: 1.6;
            padding: 8px 12px;
            background: rgba(255, 159, 67, 0.08);
            border-radius: 6px;
            border: 1px solid rgba(255, 159, 67, 0.15);
        }

        .chart-bars {
            display: flex;
            gap: 4px;
            align-items: stretch;
            height: 140px;
        }

        .bar-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            min-width: 0;
        }

        .bar-wrapper {
            flex: 1;
            width: 100%;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            min-height: 0;
        }

        .bar-label {
            font-size: 9px;
            color: #555;
            text-align: center;
        }

        .bar {
            width: 100%;
            background: rgba(108, 99, 255, 0.55);
            border-radius: 4px 4px 0 0;
            transition: all 0.3s;
            min-height: 4px;
        }

        .bar.active {
            opacity: 1;
        }

        .bar-phase {
            font-size: 8px;
            color: #444;
            text-align: center;
            line-height: 1.2;
        }

        .bar-prob {
            font-size: 7px;
            color: #666;
            text-align: center;
            line-height: 1.3;
            max-width: 60px;
            word-wrap: break-word;
        }

        .warning-box {
            background: #1a1020;
            border: 1px solid rgba(168, 85, 247, 0.27);
            border-radius: 12px;
            padding: 20px;
            margin-top: 16px;
        }

        .warning-title {
            color: #A855F7;
            font-weight: 800;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .warning-text {
            font-size: 12px;
            color: #c0c0d8;
            line-height: 1.8;
            margin-bottom: 12px;
        }

        .warning-details {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .detail-chip {
            background: #0a0a0f;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
        }

        .income-reality-box {
            background: #12121e;
            border: 1px solid rgba(255, 159, 67, 0.2);
            border-radius: 12px;
            padding: 20px;
            margin-top: 16px;
        }

        .reality-title {
            color: #FF9F43;
            font-weight: 800;
            font-size: 13px;
            margin-bottom: 6px;
        }

        .reality-description {
            color: #888;
            font-size: 11px;
            margin-bottom: 14px;
        }

        .reality-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-bottom: 12px;
        }

        .reality-card {
            background: #0a0a0f;
            border-radius: 8px;
            padding: 12px;
        }

        .reality-label {
            font-weight: 700;
            font-size: 11px;
            margin-bottom: 4px;
        }

        .reality-desc {
            color: #a0a0c0;
            font-size: 10px;
            line-height: 1.5;
        }

        .reality-rule {
            margin-top: 12px;
            padding: 10px 14px;
            background: #0a0a0f;
            border-radius: 8px;
            border: 1px solid #1e1e2e;
        }

        .reality-rule-text {
            color: #888;
            font-size: 11px;
            line-height: 1.6;
        }

        .reality-rule-text strong {
            color: #fff;
        }

        .freelancing-box {
            background: #12121e;
            border: 1px solid rgba(236, 72, 153, 0.2);
            border-radius: 12px;
            padding: 20px;
            margin-top: 16px;
        }

        .freelancing-title {
            color: #EC4899;
            font-weight: 800;
            font-size: 13px;
            margin-bottom: 6px;
        }

        .freelancing-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 10px;
            margin-bottom: 12px;
        }

        .freelancing-card {
            background: #0a0a0f;
            border-radius: 8px;
            padding: 12px;
        }

        .freelancing-card.bonus {
            border: 1px solid rgba(0, 200, 150, 0.2);
        }

        .freelancing-card.reliable {
            border: 1px solid rgba(108, 99, 255, 0.2);
        }

        .freelancing-label {
            font-weight: 700;
            font-size: 11px;
            margin-bottom: 4px;
        }

        .japan-salary-box {
            background: #12121e;
            border: 1px solid rgba(78, 205, 196, 0.2);
            border-radius: 12px;
            padding: 20px;
            margin-top: 16px;
        }

        .japan-title {
            color: #4ECDC4;
            font-weight: 800;
            font-size: 13px;
            margin-bottom: 6px;
        }

        .japan-text {
            font-size: 12px;
            color: #c0c0d8;
            line-height: 1.8;
            margin-bottom: 12px;
        }

        .japan-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
        }

        .japan-card {
            background: #0a0a0f;
            border-radius: 8px;
            padding: 12px;
        }

        .japan-card.first {
            border: 1px solid rgba(0, 200, 150, 0.2);
        }

        .japan-card.longterm {
            border: 1px solid rgba(255, 159, 67, 0.2);
        }

        /* ── DAILY OS ── */
        .dos-time-block {
            margin-bottom: 14px;
            padding: 14px;
            background: #0a0a0f;
            border-radius: 10px;
            border: 1px solid #1e1e2e;
        }
        .dos-time-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .dos-time-label {
            font-weight: 700;
            font-size: 12px;
        }
        .dos-time-total {
            font-size: 11px;
            color: #666;
            background: #12121e;
            padding: 2px 8px;
            border-radius: 4px;
        }
        .dos-breakdown {
            font-size: 11px;
            color: #a0a0c0;
            line-height: 1.8;
        }

        /* ── WEEKLY DASHBOARD ── */
        .weekly-target-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            padding: 8px 12px;
            background: #0a0a0f;
            border-radius: 6px;
            border: 1px solid #1e1e2e;
        }
        .weekly-target-check {
            width: 16px;
            height: 16px;
            border-radius: 4px;
            border: 2px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            color: #fff;
            flex-shrink: 0;
        }
        .weekly-target-check.done {
            border-color: #00C896;
            background: #00C896;
        }
        .weekly-target-label {
            font-size: 11px;
            color: #c0c0d8;
            flex: 1;
        }
        .weekly-target-label.done {
            color: #666;
            text-decoration: line-through;
        }
        .weekly-target-freq {
            font-size: 9px;
            color: #555;
        }
        .session-input {
            flex: 1;
            padding: 8px 12px;
            background: #12121e;
            border: 1px solid #1e1e2e;
            border-radius: 6px;
            color: #e8e8f0;
            font-size: 12px;
            outline: none;
        }
        .session-input:focus { border-color: #6C63FF; }
        .session-log-btn {
            padding: 8px 16px;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }
        .session-log-btn:active { opacity: 0.8; }

        /* ── CAREER BRIDGE ── */
        .career-vocab-item {
            margin-bottom: 4px;
            font-size: 11px;
        }
        .career-vocab-jp {
            color: #00C896;
            font-family: monospace;
        }
        .career-vocab-reading {
            color: #666;
        }
        .career-phrase-item {
            margin-bottom: 8px;
        }
        .career-phrase-jp {
            font-weight: 700;
            color: #e8e8f0;
        }

        /* ── FAILURE MODES ── */
        .failure-warning {
            padding: 8px 12px;
            background: #0a0a0f;
            border-radius: 6px;
            margin-bottom: 8px;
            border: 1px solid rgba(255, 107, 107, 0.15);
        }
        .failure-recovery {
            padding: 8px 12px;
            background: #0a0a0f;
            border-radius: 6px;
            border: 1px solid rgba(0, 200, 150, 0.15);
        }
        .failure-warning-title {
            font-size: 10px;
            color: #FF6B6B;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .failure-recovery-title {
            font-size: 10px;
            color: #00C896;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .failure-warning-text, .failure-recovery-text {
            font-size: 10px;
            color: #888;
            line-height: 1.6;
        }

        .footer {
            text-align: center;
            margin-top: 24px;
            color: #333;
            font-size: 11px;
        }

        @media (max-width: 768px) {
            .header-top {
                flex-direction: column;
            }

            .phase-selector {
                margin-top: 12px;
            }

            .hero-top {
                flex-direction: column;
            }

            .hero-mission {
                max-width: 100%;
            }

            .overview-grid {
                grid-template-columns: 1fr;
            }

            .reality-grid, .japan-grid, .freelancing-grid {
                grid-template-columns: 1fr;
            }

            .kpi-grid {
                grid-template-columns: 1fr;
            }
        }

        /* ═══════════════════ AI Workflow ═══════════════════ */
        .ai-guardrail-banner {
            margin-bottom: 14px;
            padding: 12px 14px;
            background: rgba(99, 102, 241, 0.08);
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 8px;
            font-size: 11px;
            color: #a0a0c0;
            line-height: 1.6;
        }

        .ai-workflow-item {
            display: flex;
            gap: 12px;
            align-items: flex-start;
            padding: 12px 14px;
            border-bottom: 1px solid #1a1a26;
        }

        .ai-workflow-item:last-child { border-bottom: none; }

        .ai-category-chip {
            flex-shrink: 0;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 4px 9px;
            border-radius: 5px;

        function getWeeklyTargets(phase) {
            const base = [
                { label: 'Technical study / project work', freq: 'Daily', done: false },
                { label: 'Japanese study (Anki + grammar)', freq: 'Daily', done: false },
            ];
            if (phase.id >= 1) base.push({ label: 'Build / deploy a project', freq: '3x/week', done: false });
            if (phase.id >= 2) base.push({ label: 'Docker / AWS practice', freq: '3x/week', done: false });
            if (phase.id >= 3) base.push({ label: 'Security / CI-CD study', freq: '2x/week', done: false });
            if (phase.id >= 4) base.push({ label: 'AWS SAA prep / labs', freq: '3x/week', done: false });
            if (phase.id >= 5) base.push({ label: 'Monitoring / pipeline build', freq: '2x/week', done: false });
            if (phase.id >= 6) base.push({ label: 'Kubernetes practice', freq: '3x/week', done: false });
            if (phase.id >= 7) base.push({ label: 'AI integration project', freq: '2x/week', done: false });
            if (phase.id >= 8) base.push({ label: 'Interview prep + applications', freq: 'Daily', done: false });
            return base;
        }

        function getWeeklyData(phase) {
            const storageKey = 'devops_weekly_' + phase.id;
            const stored = JSON.parse(localStorage.getItem(storageKey) || '{}');
            let streak = 0;
            for (let i = 0; i < 7; i++) {
                const d = new Date();
                d.setDate(d.getDate() - i);
                if (stored[d.toDateString()]) streak++;
                else break;
            }
            const today = new Date().toDateString();
            const weekTotal = Object.values(stored).reduce((a, b) => a + (b.mins || 0), 0);
            const consistency = Math.min(100, Math.round((streak / 7) * 100));
            return {
                consistency,
                streak,
                targets: getWeeklyTargets(phase),
                sessionLog: stored[today] ? `Today: ${stored[today].mins} min logged` : 'No session logged today',
                weekTotal
            };
        }

            const weekData = getWeeklyData(phase);
            const phaseColor = phase.color;

            stored[today] = { mins, timestamp: Date.now() };

            render();

        // KPI DASHBOARD MODULE (embedded at top of Tracker tab)
        // ═══════════════════════════════════════════════════════════

        function formatKPINumber(num, unit) {
            const n = Number(num) || 0;
            return unit === '৳' ? '৳' + n.toLocaleString() : n.toLocaleString() + (unit || '');
        }

        function kpiStep(target) {
            if (target >= 100000) return 5000;
            if (target >= 10000) return 500;
            if (target >= 100) return 10;
            return 1;
        }

        function getKPIProgress(phaseId) {
            try { return JSON.parse(localStorage.getItem('devops_kpi_' + phaseId) || '{}'); }
            catch (e) { return {}; }
        }

        function renderKPIDashboard(phase) {
            if (!phase.kpis || !phase.kpis.length) return '';
            const progress = getKPIProgress(phase.id);
            return `
                <div class="kpi-section">
                    <div class="kpi-section-title" style="color: ${phase.color};">🎯 Key Performance Indicators</div>
                    <div class="kpi-section-sub">Task completion (below) tells you what's done. These tell you how much — tap −/+ to log progress as you go.</div>
                    <div class="kpi-grid">
                        ${phase.kpis.map((k, i) => {
                            const current = progress[i] || 0;
                            const pct = Math.min(100, Math.round((current / k.target) * 100));
                            const barColor = pct >= 100 ? '#00C896' : phase.color;
                            return `
                                <div class="kpi-card">
                                    <div class="kpi-label">${k.label}</div>
                                    <div class="kpi-numbers">
                                        <div class="kpi-current" style="color: ${barColor};">${formatKPINumber(current, k.unit)}</div>
                                        <div class="kpi-target">of ${formatKPINumber(k.target, k.unit)}</div>
                                    </div>
                                    <div class="kpi-progress-bar">
                                        <div class="kpi-progress-fill" style="background: ${barColor}; width: ${pct}%;"></div>
                                    </div>
                                    <div class="kpi-controls">
                                        <button class="kpi-btn" onclick="stepKPI(${phase.id}, ${i}, -1)">−</button>
                                        <button class="kpi-btn" onclick="stepKPI(${phase.id}, ${i}, 1)">+</button>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        function stepKPI(phaseId, kpiIndex, direction) {
            const phase = PHASES.find(p => p.id === phaseId);
            if (!phase || !phase.kpis[kpiIndex]) return;
            const step = kpiStep(phase.kpis[kpiIndex].target);
            const progress = getKPIProgress(phaseId);
            const next = Math.max(0, (progress[kpiIndex] || 0) + (direction * step));
            progress[kpiIndex] = next;
            localStorage.setItem('devops_kpi_' + phaseId, JSON.stringify(progress));
            render();
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function getISOWeekKey(date) {
            const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
            const dayNum = d.getUTCDay() || 7;
            d.setUTCDate(d.getUTCDate() + 4 - dayNum);
            const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
            const weekNo = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
            return d.getUTCFullYear() + '-W' + String(weekNo).padStart(2, '0');
        }

        function getHealthData() {
            const weekKey = getISOWeekKey(new Date());
            let stored = {};
            try { stored = JSON.parse(localStorage.getItem('devops_health') || '{}'); } catch (e) {}
            return { weekKey, checked: stored[weekKey] || {} };
        }

        function getCheckpoints() {
            try { return JSON.parse(localStorage.getItem('devops_checkpoints') || '[]'); }
            catch (e) { return []; }
        }

        function renderWellbeing(phase) {
            const health = getHealthData();
            const checkpoints = getCheckpoints();
            const healthCheckedCount = Object.values(health.checked).filter(Boolean).length;
            const healthPct = Math.round((healthCheckedCount / HEALTH_CHECKLIST.length) * 100);

            return `
                <div class="tracker-container" style="border-color: rgba(${hexToRgb(phase.color)}, 0.2);">
                    <div class="wellbeing-section-title">❤️ Health System — This Week (${health.weekKey})</div>
                    <div class="wellbeing-section-sub">Resets automatically each week. The roadmap spans years — this is what protects the person running it.</div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="background: #EC4899; width: ${healthPct}%;"></div>
                    </div>
                    ${HEALTH_CHECKLIST.map((h, i) => {
                        const isChecked = !!health.checked[i];
                        return `
                            <div class="checklist-item ${isChecked ? 'checked' : ''}" onclick="toggleHealthItem(${i})">
                                <div class="checkbox" style="${isChecked ? `border-color: #EC4899; background: #EC4899;` : ''}">${isChecked ? '✓' : ''}</div>
                                <div class="checklist-item-text">${h.label} <span style="color:#666;">— ${h.freq}</span></div>
                            </div>
                        `;
                    }).join('')}

                    <div class="wellbeing-section-title" style="margin-top: 30px;">🔄 6-Month Decision Checkpoint</div>
                    <div class="wellbeing-section-sub">Log a check-in roughly every 6 months. This isn't about redoing the plan — it's about noticing early if something needs to change.</div>
                    <div class="checkpoint-prompt-list">
                        ${CHECKPOINT_QUESTIONS.map(q => `<div class="checkpoint-prompt-item">• ${q}</div>`).join('')}
                    </div>
                    <textarea id="checkpointNotes" class="checkpoint-textarea" placeholder="Answer whichever prompts above feel relevant right now..."></textarea>
                    <div>
                        <button class="checkpoint-save-btn" onclick="saveCheckpoint(${phase.id})">Save Checkpoint</button>
                    </div>
                    ${checkpoints.length ? checkpoints.slice().reverse().map((c, idx) => {
                        const realIdx = checkpoints.length - 1 - idx;
                        return `
                            <div class="checkpoint-entry">
                                <div class="checkpoint-entry-date">${c.date} · ${c.phaseLabel}</div>
                                <div class="checkpoint-entry-notes">${escapeHtml(c.notes)}</div>
                                <div class="checkpoint-delete" onclick="deleteCheckpoint(${realIdx})">Delete entry</div>
                            </div>
                        `;
                    }).join('') : '<div style="font-size: 11px; color: #555; padding: 8px 0 4px;">No checkpoints logged yet.</div>'}
                </div>
            `;
        }

        function toggleHealthItem(index) {
            const weekKey = getISOWeekKey(new Date());
            let stored = {};
            try { stored = JSON.parse(localStorage.getItem('devops_health') || '{}'); } catch (e) {}
            if (!stored[weekKey]) stored[weekKey] = {};
            stored[weekKey][index] = !stored[weekKey][index];
            localStorage.setItem('devops_health', JSON.stringify(stored));
            render();
        }

        function saveCheckpoint(phaseId) {
            const textarea = document.getElementById('checkpointNotes');
            const notes = (textarea && textarea.value || '').trim();
            if (!notes) return;
            const phase = PHASES.find(p => p.id === phaseId);
            const checkpoints = getCheckpoints();
            checkpoints.push({
                date: new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' }),
                phaseLabel: phase ? phase.label : '',
                notes,
            });
            localStorage.setItem('devops_checkpoints', JSON.stringify(checkpoints));
            render();
        }

        function deleteCheckpoint(index) {
            const checkpoints = getCheckpoints();
            checkpoints.splice(index, 1);
            localStorage.setItem('devops_checkpoints', JSON.stringify(checkpoints));
            render();
        }

        function switchPhase(index) {
            activePhase = index;
            activeTab = "overview";
            render();
        }

        function switchTab(tab) {
            activeTab = tab;
            render();
        }

        function toggleCheck(phaseId, taskIdx) {
            const key = `${phaseId}-${taskIdx}`;
            checkedItems[key] = !checkedItems[key];
            render();
        }

        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? `${parseInt(result[1], 16)}, ${parseInt(result[2], 16)}, ${parseInt(result[3], 16)}` : "0, 0, 0";
        }

        function attachEventListeners() {
            // Event listeners are attached via onclick attributes in the HTML
        }

        // Initial render
        render();
    </script>
</body>
</html>
